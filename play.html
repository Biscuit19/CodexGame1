class AudioEngine{
 constructor(){this.ctx=null;this.master=null;this.musicClock=0;this.noteIndex=0;this.lastShot=0;}
 init(){try{if(!this.ctx){this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=settings.volume*.35;this.master.connect(this.ctx.destination);}if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});}catch{}}
 tone(freq,len,type='sine',vol=.2,slide=1){if(!this.ctx||this.ctx.state!=='running')return;const now=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),now+len);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(Math.max(.002,vol),now+.009);g.gain.exponentialRampToValueAtTime(.001,now+len);o.connect(g);g.connect(this.master);o.start(now);o.stop(now+len+.03);}
 sound(name){if(name==='shoot'){const now=performance.now();if(now-this.lastShot<80)return;this.lastShot=now;this.tone(280,.075,'triangle',.11,.45);}if(name==='dash')this.tone(180,.2,'sine',.22,3);if(name==='echo'){this.tone(330,.45,'sine',.15,2);this.tone(495,.6,'sine',.1,1.5);}if(name==='hurt')this.tone(95,.2,'triangle',.3,.5);if(name==='kill')this.tone(540,.055,'sine',.04,1.4);if(name==='beacon'||name==='bosskill'){[262,330,392,524].forEach((f,i)=>setTimeout(()=>this.tone(f,.65,'sine',.16),i*100));}if(name==='boss')this.tone(70,1.5,'triangle',.2,.7);if(name==='select')this.tone(660,.15,'sine',.1,1.5);}
 update(dt){if(this.master)this.master.gain.value=clamp(settings.volume,0,1)*.35;if(!settings.music||paused||!game||game.mode!=='playing')return;this.musicClock-=dt;if(this.musicClock<=0){const notes=[130.81,196,261.63,293.66,329.63,196,164.81,220];this.tone(notes[this.noteIndex++%notes.length],2.5,'sine',.065);if(this.noteIndex%4===0)this.tone(65.41,3.5,'sine',.045);this.musicClock=1.6;}}
}

 setOverlay(modal(win?'所有归途，都有了光。':'这束光，不会被遗忘。',win?'VOYAGE COMPLETE / 05 LIGHTHOUSES':'END OF THIS VOYAGE',`<p class="ending-quote">${win?'你没有带走海里的星星。你教会了它们，怎样再次发光。':'海会记住你的名字。下一次潮起，我们再出发。'}</p><p>${win?'五座灯塔依次点亮，迷失的回声终于找到了归途。感谢你完成这一场远行。':'救援机会已用尽。试试更频繁地使用冲刺与回声，或开启辅助瞄准。随机的新旅程会带来不同的可能。'}</p><div class="stat-grid"><div>航行时间<b>${fmt(game.elapsed)}</b></div><div>修复灯塔<b>${game.bossKills} / 5</b></div><div>击退敌人<b>${game.kills}</b></div><div>最终等级<b>${game.player.level}</b></div><div>回声召唤<b>${game.stats.echoes}</b></div><div>获得遗物<b>${Object.values(game.relics).reduce((a,b)=>a+b,0)}</b></div></div><p class="note">${win?'已完成完整战役。你可以开启新的随机航行，寻找尚未发现的传说组合。':'每次启航都会重新生成一条航线。'}<br>本局种子：${game.seed}</p>`,button('home','返回首页')+button('new','再次启航 →',true)));}
function handleEvents(){if(!game)return;for(const e of game.drain()){renderer.event(e);if(e.type==='sound')audio.sound(e.name);if(e.type==='toast')toast(e.text);if(e.type==='event'){eventText=e.text;toast(e.text);}if(e.type==='sector'){eventText='';toast(`${game.zone.name} · 航段 ${game.sector+1} / 15`);if(game.sector%3===0)$('subtitles').textContent=game.zone.story;}if(e.type==='boss'){eventText='灯塔守卫出现 · 击败首领以恢复航线';toast(e.text);}if(e.type==='choice'&&game.mode==='choice')choiceMenu();if(e.type==='death')endMenu(false);if(e.type==='win')endMenu(true);}}
function updateHUD(){if(!game)return;const p=game.player,w=weaponInfo(game.weapon);$('hp').textContent=`${Math.ceil(p.hp)} / ${p.maxHp}`;$('rescues').textContent=`救援 ${p.rescues}`;$('level').textContent=`LV.${String(p.level).padStart(2,'0')}`;$('hpbar').style.width=`${p.hp/p.maxHp*100}%`;$('hpbar').style.background=p.hp/p.maxHp<.3?'#efa48d':'#a4f5d6';$('xpbar').style.width=`${p.xp/game.xpNeed*100}%`;$('resources').textContent=`✧ ${p.coins} 星币　 /　 击退 ${game.kills}`;$('zone').textContent=`${game.zone.name} · ${String(game.sector+1).padStart(2,'0')}`;$('objective').textContent=game.boss?'击败灯塔守卫，恢复航线':`寻找信标，等待潮汐平息 · ${fmt(Math.max(0,game.duration-game.time))}`;$('progressbar').style.width=`${Math.min(100,game.time/game.duration*100)}%`;$('tide').textContent=`${game.highTide?'☽ 涨潮 · 敌人减速':'☼ 退潮 · 海流平稳'}　${Math.ceil(24-game.time%24)}s`;$('clock').textContent=`${fmt(game.elapsed)}　 /　 灯塔 ${game.bossKills}/5`;
 $('weaponhud').innerHTML=`<span style="color:${w.rarityInfo.color};font-size:9px;letter-spacing:2px">${w.rarityInfo.name} / ${w.el.name}</span><b>${esc(game.weapon.name)}</b><small>${settings.autoFire?'自动射击':'鼠标左键射击'} · 无限弹药</small>`;
 for(const [id,key,label,cd,max]of[['dashhud','SHIFT','折光冲刺',p.dashCD,game.dashMax],['echohud','Q','余响复写',p.echoCD,game.echoMax]]){$(id).className=`skill panel ${cd<=0?'ready':''}`;$(id).innerHTML=`<b>${key}</b>${label}<span>${cd>0?`${cd.toFixed(1)}s 恢复中`:'已就绪'}</span><div class="bar" style="height:2px;margin-top:7px"><i style="width:${(1-cd/max)*100}%"></i></div>`;}
 const chest=game.chests.find(c=>Math.hypot(c.x-p.x,c.y-p.y)<90);$('interaction').style.display=chest?'block':'none';if(chest)$('interaction').textContent=`E · 打开物资箱${chest.cost?`（${chest.cost} 星币）`:''}`;
 $('bossbar').hidden=!game.boss;if(game.boss){$('bossname').textContent=game.boss.name;$('bosshp').style.width=`${Math.max(0,game.boss.hp/game.boss.maxHp)*100}%`;}$('eventbanner').textContent=game.activeEvent?`${eventText} · ${Math.ceil(game.activeEvent.left)}s`:game.boss?'灯塔守卫 · 注意橙色攻击预警':'';
 if(performance.now()>toastUntil)$('toast').style.opacity='0';if(game.time>15)$('subtitles').textContent='';}
const actions={home,new:newMenu,start,begin:()=>{audio.init();resume();},continue:()=>{game=saved();if(!game){toast('存档无法读取，请重新启航');home();return;}audio.init();renderer.camera={x:game.player.x,y:game.player.y};$('hud').hidden=false;$('brand').hidden=true;eventText='航行已恢复';if(game.mode==='choice')choiceMenu();else pause();},resume,pause,help,settings:settingsMenu,build:buildMenu,back:()=>game?pause():home(),skip:()=>{game.skipChoice();resume();save();},fullscreen:async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch{toast('浏览器未允许全屏，可使用 F11');}}};
overlay.addEventListener('click',e=>{audio.init();const b=e.target.closest('button');if(!b)return;if(b.dataset.action){audio.sound('select');actions[b.dataset.action]?.();}if(b.dataset.difficulty){difficulty=b.dataset.difficulty;newMenu();}if(b.dataset.setting){settings[b.dataset.setting]=!settings[b.dataset.setting];saveSettings();settingsMenu();}if(b.dataset.choice!==undefined){audio.sound('select');game.choose(Number(b.dataset.choice));if(game.mode==='choice')choiceMenu();else resume();save();}});
overlay.addEventListener('input',e=>{if(e.target.id==='volume'){settings.volume=Number(e.target.value);saveSettings();audio.init();}});
$('pause').addEventListener('click',pause);$('build').addEventListener('click',buildMenu);
window.addEventListener('resize',()=>renderer.resize());
window.addEventListener('keydown',e=>{
 if(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)&&game)e.preventDefault();if(e.repeat)return;
 if(e.code==='Escape'){if(game){if(screen==='playing')pause();else if(['pause','build','help','settings','tutorial'].includes(screen))resume();}else if(screen!=='home')home();return;}
 if(e.code==='Tab'&&game){if(screen==='playing')buildMenu();else if(screen==='build')resume();return;}
 if(screen==='choice'&&['Digit1','Digit2','Digit3'].includes(e.code)){overlay.querySelector(`[data-choice="${Number(e.code.slice(-1))-1}"]`)?.click();return;}
 if(screen!=='playing'||paused)return;keys.add(e.code);if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='Space')pulses.dash=true;if(e.code==='KeyQ')pulses.echo=true;if(e.code==='KeyE')pulses.interact=true;
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
$('game').addEventListener('pointerdown',e=>{audio.init();if(screen==='playing'&&!paused){if(e.button===0)mouse.down=true;if(e.button===2)pulses.echo=true;}});
window.addEventListener('pointerup',()=>mouse.down=false);window.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{keys.clear();mouse.down=false;if(screen==='playing')pause();else save();});document.addEventListener('visibilitychange',()=>{if(document.hidden){if(screen==='playing')pause();save();}});window.addEventListener('pagehide',save);
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;renderer.reduced=settings.reduced;
 if(game&&screen==='playing'&&!paused&&game.mode==='playing'){
 let aim=renderer.screenToWorld(mouse.x,mouse.y),p=game.player;if(settings.autoAim){const enemy=game.enemies.filter(e=>e.hp>0).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(enemy)aim=enemy;}
 const input={mx:(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0),my:(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0),ax:aim.x-p.x,ay:aim.y-p.y,shoot:mouse.down||settings.autoFire,...pulses};
 game.update(dt,input);pulses={dash:false,echo:false,interact:false};handleEvents();saveClock+=dt;if(saveClock>10){save();saveClock=0;}
 }
 audio.update(dt);renderer.draw(game,paused||(game&&game.mode!=='playing')?0:dt);hudClock+=dt;if(hudClock>.1){updateHUD();hudClock=0;}requestAnimationFrame(loop);
}
if(new URLSearchParams(location.search).has('test'))window.__ECHO__={get game(){return game;},get screen(){return screen;},get renderer(){return renderer;},get settings(){return settings;},setGame(g){game=g;$('hud').hidden=false;$('brand').hidden=true;resume();},Game,save,handleEvents,resume,pause,choiceMenu,updateHUD};
home();saveSettings();requestAnimationFrame(loop);

</script>
