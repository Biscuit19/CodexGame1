<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08171c"><meta name="description" content="余响航线：在沉没记忆海中拾取光，构筑独特武器，与你的回声并肩而战。"><title>余响航线 · ECHO DRIFT</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2397efd2' d='M32 2 56 48 32 62 8 48Z'/%3E%3Cpath fill='%23091820' d='M32 16 40 43 24 43Z'/%3E%3C/svg%3E"><link rel="stylesheet" href="/src/style.css"></head>
