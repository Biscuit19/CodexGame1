<script type="module">

class SaveSlots{
 constructor(storage){this.storage=storage;this.key='echo-drift-slots-v1';this.active=0;this.slots=[null,null,null];this.load();}
 load(){const raw=this.storage.getItem(this.key);if(raw){const d=JSON.parse(raw);if(!Array.isArray(d.slots)||d.slots.length!==3)throw new Error('存档槽数据损坏');this.slots=d.slots;this.active=Number.isInteger(d.active)&&d.active>=0&&d.active<3?d.active:0;}else{const old=this.storage.getItem('echo-drift-save-v2');if(old){this.slots[0]={data:JSON.parse(old),updated:Date.now()};this.persist();this.storage.removeItem('echo-drift-save-v2');}}}
 persist(){this.storage.setItem(this.key,JSON.stringify({active:this.active,slots:this.slots}));}
 select(i){if(!Number.isInteger(i)||i<0||i>2)throw new Error('无效存档槽');this.active=i;this.persist();}
 write(data){this.slots[this.active]={data,updated:Date.now()};this.persist();}
 read(i=this.active){return this.slots[i]?.data||null;}
}

const assetUrl=path=>globalThis.__ECHO_ASSETS__?.[path]||new URL(path,document.baseURI).href;
const MUSIC_TRACKS={"early1": {"title": "Mediterranean Waves", "author": "Wildfire Games", "group": "early"}, "early2": {"title": "Elysian Fields", "author": "Wildfire Games", "group": "early"}, "early3": {"title": "The Road Ahead", "author": "Wildfire Games", "group": "early"}, "early4": {"title": "As Seasons Change", "author": "Wildfire Games", "group": "early"}, "early5": {"title": "Sunrise", "author": "Wildfire Games", "group": "early"}, "middle1": {"title": "Expedition", "author": "Wildfire Games", "group": "middle"}, "middle2": {"title": "Celtic Pride", "author": "Wildfire Games", "group": "middle"}, "middle3": {"title": "Forging a City-State", "author": "Wildfire Games", "group": "middle"}, "middle4": {"title": "From Every Corner", "author": "Wildfire Games", "group": "middle"}, "middle5": {"title": "Roman Ingenuity", "author": "Wildfire Games", "group": "middle"}, "late1": {"title": "Northern Frontier", "author": "Wildfire Games", "group": "late"}, "late2": {"title": "Bandit Country", "author": "Wildfire Games", "group": "late"}, "late3": {"title": "Honor Bound", "author": "Wildfire Games", "group": "late"}, "late4": {"title": "Rise of Macedon", "author": "Wildfire Games", "group": "late"}, "late5": {"title": "Tale of Warriors", "author": "Wildfire Games", "group": "late"}, "boss1": {"title": "Alba Longa Burns", "author": "Wildfire Games", "group": "boss"}, "boss2": {"title": "Only 300 Stood", "author": "Wildfire Games", "group": "boss"}, "boss3": {"title": "Point of No Return", "author": "Wildfire Games", "group": "boss"}, "boss4": {"title": "Red Dawn", "author": "Wildfire Games", "group": "boss"}, "boss5": {"title": "The Governor", "author": "Wildfire Games", "group": "boss"}, "event1": {"title": "Taiko 1", "author": "Wildfire Games", "group": "event"}, "event2": {"title": "Taiko 2", "author": "Wildfire Games", "group": "event"}, "event3": {"title": "Calm Before the Storm", "author": "Wildfire Games", "group": "event"}, "early6": {"title": "Harvest Festival", "author": "Wildfire Games", "group": "early"}, "early7": {"title": "Mountain Idyll", "author": "Wildfire Games", "group": "early"}, "early8": {"title": "Along the Nile", "author": "Wildfire Games", "group": "early"}, "early9": {"title": "Harvest Moon", "author": "Wildfire Games", "group": "early"}, "middle6": {"title": "Celtica", "author": "Wildfire Games", "group": "middle"}, "middle7": {"title": "Cisalpine Gaul", "author": "Wildfire Games", "group": "middle"}, "middle8": {"title": "Beyond The Indus", "author": "Wildfire Games", "group": "middle"}, "middle9": {"title": "The Fledgling Kingdom", "author": "Wildfire Games", "group": "middle"}, "late6": {"title": "Harsh Lands Rugged People", "author": "Wildfire Games", "group": "late"}, "late7": {"title": "The Hellespont", "author": "Wildfire Games", "group": "late"}, "late8": {"title": "The Pillars of Hercules", "author": "Wildfire Games", "group": "late"}, "late9": {"title": "Land Between Rivers", "author": "Wildfire Games", "group": "late"}, "boss6": {"title": "Upstart King", "author": "Wildfire Games", "group": "boss"}, "boss7": {"title": "Juno Protect You", "author": "Wildfire Games", "group": "boss"}, "boss8": {"title": "In the Shadow of Olympus", "author": "Wildfire Games", "group": "boss"}, "boss9": {"title": "Helen Leaves Sparta", "author": "Wildfire Games", "group": "boss"}, "boss10": {"title": "Ammon-Ra", "author": "Wildfire Games", "group": "boss"}, "event4": {"title": "Karmic Confluence", "author": "Wildfire Games", "group": "event"}, "event5": {"title": "Peaks of Atlas", "author": "Wildfire Games", "group": "event"}, "event6": {"title": "Eastern Dreams", "author": "Wildfire Games", "group": "event"}};
const musicPool=group=>Object.keys(MUSIC_TRACKS).filter(id=>MUSIC_TRACKS[id].group===group);
function musicGroup(game){if(game?.boss)return 'boss';if(game?.activeEvent&&['invasion','pincer','elite','surge','hunt','mines','convoy','twins','relay','rift','meteor'].includes(game.activeEvent.id))return 'event';return !game||game.sector<5?'early':game.sector<10?'middle':'late';}


class Soundtrack{
 constructor(){this.channels=new Map();this.current='';this.unlocked=false;this.error='';this.switches=0;this.context='';this.bags={};this.playTime=0;this.lastByGroup={};}
 unlock(){this.unlocked=true;}

 sound(name,frame){if(name.startsWith('boss-')){const parts=name.split('-'),kind=Number(parts[2])||0,attack=parts[1],base={windup:320,impact:95,ring:540,laser:1050,bomb:145,fan:240,summon:420}[attack]||220;this.tone(base+kind*37,attack==='laser'?.32:.2,attack==='laser'?'sawtooth':'triangle',.18,attack==='windup'?1.6:.35);if(attack==='impact'||attack==='bomb')this.shotNoise();if(attack==='summon')this.tone(680+kind*20,.3,'sine',.1,1.4);if(attack==='ring')this.tone(base*1.5,.12,'sine',.1,.8);return;}if(name==='shoot'){const now=performance.now();if(now-this.lastShot<45)return;this.lastShot=now;const heavy=['fan','rail','bloom','comet'].includes(frame),pitch=heavy?150:310;this.tone(pitch,heavy?.14:.09,'triangle',.52,.28);this.tone(1600,.035,'sine',.13,.35);this.shotNoise();}if(name==='slam'){this.tone(105,.22,'triangle',.38,.3);this.shotNoise();}if(name==='charge'){this.tone(380,.18,'sine',.13,1.5);}if(name==='dash')this.tone(180,.2,'sine',.22,3);if(name==='echo'){this.tone(330,.45,'sine',.15,2);this.tone(495,.6,'sine',.1,1.5);}if(name==='hurt'){this.tone(175,.22,'sawtooth',.28,.25);this.tone(520,.13,'triangle',.2,.38);this.shotNoise();setTimeout(()=>this.tone(110,.1,'sine',.18,.6),65);}if(name==='kill')this.tone(540,.055,'sine',.04,1.4);if(name==='beacon'||name==='bosskill'){[262,330,392,524].forEach((f,i)=>setTimeout(()=>this.tone(f,.65,'sine',.16),i*100));}if(name==='boss')this.tone(70,1.5,'triangle',.2,.7);if(name==='select')this.tone(660,.15,'sine',.1,1.5);}
 update(dt){if(this.master)this.master.gain.value=clamp(settings.volume,0,1)*.8*(settings.sfxVolume??1);this.track.update(dt,settings,game,!paused&&!document.hidden);}

 setOverlay(modal(win?'战役通关 · 可继续无尽模式':'本局结束','',`<p>${win?'战役完成，可保留构筑继续无尽模式。':'救援次数已用尽。'}</p>${win?bossForecast(20,true):''}<div class="stat-grid"><div>累计伤害<b class="num-damage">${damageTotal()}</b></div><div>航行时间<b>${fmt(game.elapsed)}</b></div><div>击败首领<b>${game.bossKills}</b></div><div>击退敌人<b>${game.kills}</b></div><div>最终等级<b>${game.player.level}</b></div><div>回声召唤<b>${game.stats.echoes}</b></div><div>获得遗物<b>${Object.values(game.relics).reduce((a,b)=>a+b,0)}</b></div></div>`,button('home','返回首页')+(win?button('endless','保留构筑 · 无尽模式 →',true):button('new','再次启航 →',true))));}
function handleEvents(){if(!game)return;for(const e of game.drain()){renderer.event(e);if(e.type==='sound')audio.sound(e.name,e.frame);if(e.type==='hit')audio.impact(e.crit);if(e.type==='toast')toast(e.text);if(e.type==='event'){eventText=e.text;announce(e.text);}if(e.type==='sector'){eventText='';toast(`${game.sectorTheme?.name||game.zone.name} · 航段 ${game.sector+1} / 20`);$('subtitles').textContent='';}if(e.type==='boss'){eventText='首领战 · 清除全部守卫';announce(e.text);}if(e.type==='choice'&&game.mode==='choice')choiceMenu();if(e.type==='shop'&&game.mode==='shop')shopMenu();if(e.type==='death')endMenu(false);if(e.type==='win')endMenu(true);}}
function updateHUD(){if(!game)return;const p=game.player,w=weaponInfo(game.weapon);$('hp').textContent=`${Math.ceil(p.hp)} / ${p.maxHp}`;$('rescues').textContent=`救援 ${p.rescues}`;$('level').textContent=`LV.${String(p.level).padStart(2,'0')}`;$('hpbar').style.width=`${p.hp/p.maxHp*100}%`;$('hpbar').style.background=p.hp/p.maxHp<.3?'linear-gradient(90deg,#e23451,#ff9d9d)':'linear-gradient(90deg,#39bb9b,#b4ffce)';$('hpbar').closest('.hud-left').classList.toggle('low-health',p.hp/p.maxHp<.3);$('xpbar').style.width=`${p.xp/game.xpNeed*100}%`;$('resources').innerHTML=`${itemIcon('coins')} <b class="num-gold">${p.coins}</b> 星币　 /　 击退 ${game.kills}`;$('zone').textContent=`${game.zone.name} · ${String(game.sector+1).padStart(2,'0')}${game.endless?' · 无尽':''}`;$('objective').textContent=game.collectionTime>0?'清场完成 · 正在收取金币、经验与物资箱':game.clearing?`清场 · 剩余 ${game.enemies.filter(e=>e.hp>0).length} 名敌人${game.incursions.length?' · 增援抵达中':''}`:`${game.boss?'击败守卫':game.stageBossTarget&&!game.bossSpawned?`首领 ${Math.ceil(Math.max(0,10-game.time))} 秒后出现`:(game.sectorTheme?.name||'敌潮来袭')} · 停止刷新 ${fmt(Math.max(0,game.duration-game.time))}`;$('progressbar').style.width=`${Math.min(100,game.time/game.duration*100)}%`;$('tide').textContent=`${game.highTide?'☽ 涨潮 · 敌潮增强':'☼ 退潮 · 沙洲浮现'}　${Math.ceil(24-game.time%24)}s`;$('clock').textContent=`${fmt(game.elapsed)}　 /　 首领击败 ${game.bossKills}`;
 $('weaponhud').innerHTML=`${itemIcon('weapon',game.weapon.frame)}<div><span style="color:${w.rarityInfo.color};font-size:18px;letter-spacing:1px">${w.rarityInfo.name} / ${w.el.name}</span><b>${esc(w.name)}</b><small>${settings.autoFire?'自动射击':'鼠标左键射击'} · 无限弹药</small></div>`;
 for(const [id,key,label,cd,max,path]of[['dashhud','空格 / Shift','折光冲刺',p.dashCD,game.dashMax,'M5 19h14M2 31h14M5 43h14M27 11l27 21-27 21 7-16H18V27h16Z'],['echohud','Q','自动瞄准分身',p.echoCD,game.echoMax,'M17 12a8 8 0 1 0 0 16 8 8 0 1 0 0-16M4 52V38q13-15 26 0v14ZM42 7a9 9 0 1 0 0 18 9 9 0 1 0 0-18M28 53V36q14-16 28 0v17ZM34 30l8 5 8-5']]){const el=$(id),ready=cd<=0;if(!el.querySelector('.skill-art'))el.innerHTML=`<div class="skill-art">${itemIcon(id==='dashhud'?'abilityDash':'abilityEcho')}<div class="skill-veil"></div></div><div class="skill-info"><b>${key}</b><strong>${label}</strong><span></span></div>`;el.classList.toggle('cooling',!ready);el.classList.toggle('ready',ready);el.querySelector('.skill-veil').style.height=`${Math.min(100,cd/max*100)}%`;el.querySelector('.skill-info span').textContent=ready?'已就绪':cd.toFixed(1)+'s';if(ready&&skillWasReady[id]===false){el.classList.remove('skill-flash');void el.offsetWidth;el.classList.add('skill-flash');}skillWasReady[id]=ready;}

 const chest=game.chests.find(c=>Math.hypot(c.x-p.x,c.y-p.y)<90);const nearShop=Math.hypot(p.x-1100,p.y-800)<120;$('interaction').style.display=!game.collectionTime&&(chest||nearShop)?'block':'none';if(!chest&&nearShop)$('interaction').textContent='B / E · 星币商店 · '+p.coins+' ✧';if(chest)$('interaction').textContent=`E · 打开物资箱${chest.cost?`（${chest.cost} 星币）`:''}`;
 $('bossbar').hidden=!game.boss;if(game.boss){$('bossname').textContent=game.bosses.length>1?`首领 × ${game.bosses.length} · ${game.bosses.map(e=>e.name.split(' · ')[0]).join(' / ')}`:game.boss.name;const hp=game.bosses.reduce((n,e)=>n+e.hp,0),max=game.bosses.reduce((n,e)=>n+e.maxHp,0);$('bosshp').style.width=`${hp/max*100}%`;}
 const ev=game.activeEvent;$('eventbanner').textContent=ev?`${EVENT_NAMES[ev.id]}${ev.combat?' · 剩余 '+ev.targets.filter(id=>game.enemies.some(e=>e.id===id&&e.hp>0)).length+' 名目标':' · '+Math.max(0,Math.ceil(ev.left))+'s'}`:game.boss?'首领战 · 注意红色攻击预警':'';
 $('eventbanner').style.opacity=performance.now()<announcementUntil?'0':'1';if(performance.now()>announcementUntil||(!game.activeEvent&&!game.boss))$('eventtitle').classList.remove('show');

 $('musiclabel').textContent=settings.music?'♫ '+audio.track.title:'';const elite=game.enemies.find(e=>e.elite&&e.hp>0);$('elitebar').hidden=!elite;if(elite){$('elitename').textContent=`黄金悬赏 · ${Math.ceil(elite.ttl)}s 后消失 · ${120+game.sector*8} ✧ + 宝箱`;$('elitehp').style.width=`${Math.max(0,elite.hp/elite.maxHp)*100}%`;}if(performance.now()>toastUntil)$('toast').style.opacity='0';if(game.time>15)$('subtitles').textContent='';}
const actions={slots:slotsMenu,shop:()=>{if(game.openShop()){shopMenu();save();}else toast('靠近中央商店，或在过关路线界面购物');},closeShop:()=>{game.closeShop();resume();save();},rerollShop:()=>{if(!game.rerollShop())toast('星币不足，无法刷新');shopMenu();save();},rerollReward:()=>{if(!game.rerollReward())toast('星币不足，无法刷新');choiceMenu();save();},credits:creditsMenu,endless:()=>{if(game.startEndless()){resume();handleEvents();save();}},home,new:slotsMenu,start,begin:()=>{audio.init();resume();},continue:()=>{game=saved();if(!game){toast('存档无法读取，请重新启航');home();return;}audio.init();renderer.camera={x:game.player.x,y:game.player.y};$('hud').hidden=false;$('brand').hidden=true;eventText='航行已恢复';if(['won','dead'].includes(game.mode)){endMenu(game.mode==='won');return;}if(game.mode==='choice')choiceMenu();else if(game.mode==='shop')shopMenu();else pause();},resume,pause,help,settings:settingsMenu,build:buildMenu,back:()=>game?pause():home(),skip:()=>{game.skipChoice();resume();save();},fullscreen:async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch{toast('浏览器未允许全屏，可使用 F11');}}};
overlay.addEventListener('click',e=>{audio.init();const b=e.target.closest('button');if(!b)return;if(b.dataset.slot!==undefined){selectSlot(Number(b.dataset.slot));return;}if(b.dataset.create!==undefined||b.dataset.restart!==undefined){selectSlot(Number(b.dataset.create??b.dataset.restart),true);return;}if(b.dataset.action){audio.sound('select');actions[b.dataset.action]?.();}if(b.dataset.difficulty){difficulty=b.dataset.difficulty;newMenu();}if(b.dataset.setting){settings[b.dataset.setting]=!settings[b.dataset.setting];saveSettings();settingsMenu();}if(b.dataset.buy){if(!game.buy(b.dataset.buy))toast('无法购买：检查余额、生命或强化上限');shopMenu();save();}if(b.dataset.choice!==undefined){audio.sound('select');game.choose(Number(b.dataset.choice));if(game.mode==='choice')choiceMenu();else resume();save();}});
overlay.addEventListener('input',e=>{if(['volume','musicVolume','sfxVolume'].includes(e.target.id)){settings[e.target.id]=Number(e.target.value);saveSettings();audio.init();}});
$('pause').addEventListener('click',pause);$('build').addEventListener('click',buildMenu);
window.addEventListener('resize',()=>renderer.resize());
window.addEventListener('keydown',e=>{
 if(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)&&game)e.preventDefault();if(e.repeat)return;
 if(e.code==='Escape'){if(game){if(screen==='shop'){actions.closeShop();return;}if(screen==='playing')pause();else if(['pause','build','help','settings','tutorial','credits'].includes(screen))resume();}else if(screen!=='home')home();return;}
 if(e.code==='Tab'&&game){if(screen==='playing')buildMenu();else if(screen==='build')resume();return;}
 if(screen==='choice'&&['Digit1','Digit2','Digit3'].includes(e.code)){overlay.querySelector(`[data-choice="${Number(e.code.slice(-1))-1}"]`)?.click();return;}
 if(e.code==='KeyB'&&screen==='playing'){actions.shop();return;}if(screen!=='playing'||paused)return;keys.add(e.code);if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='Space')pulses.dash=true;if(e.code==='KeyQ')pulses.echo=true;if(e.code==='KeyE')pulses.interact=true;
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
$('game').addEventListener('pointerdown',e=>{audio.init();if(screen==='playing'&&!paused){if(e.button===0)mouse.down=true;if(e.button===2)pulses.echo=true;}});
window.addEventListener('pointerup',()=>mouse.down=false);window.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{keys.clear();mouse.down=false;if(screen==='playing')pause();else save();});document.addEventListener('visibilitychange',()=>{if(document.hidden){if(screen==='playing')pause();save();}});window.addEventListener('pagehide',save);
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;renderer.reduced=settings.reduced;
 if(game&&screen==='playing'&&!paused&&game.mode==='playing'){
 let aim=renderer.screenToWorld(mouse.x,mouse.y),p=game.player;if(settings.autoAim){const enemy=game.enemies.filter(e=>e.hp>0).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(enemy)aim=enemy;}
 const input={mx:(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0),my:(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0),ax:aim.x-p.x,ay:aim.y-p.y,shoot:mouse.down||settings.autoFire,...pulses};
 game.update(dt,input);pulses={dash:false,echo:false,interact:false};handleEvents();saveClock+=dt;if(saveClock>10){save();saveClock=0;}
 }
 audio.update(dt);renderer.draw(game,paused||(game&&game.mode!=='playing')?0:dt);hudClock+=dt;if(hudClock>.1){updateHUD();hudClock=0;}requestAnimationFrame(loop);
}
if(new URLSearchParams(location.search).has('test'))window.__ECHO__={get game(){return game;},get screen(){return screen;},get saveSlots(){return saveSlots;},get renderer(){return renderer;},get settings(){return settings;},get soundtrack(){return audio.track;},get audio(){return audio;},setGame(g){game=g;$('hud').hidden=false;$('brand').hidden=true;resume();},Game,save,handleEvents,resume,pause,choiceMenu,updateHUD};
home();saveSettings();requestAnimationFrame(loop);
